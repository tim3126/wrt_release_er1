name: Release Taiyi Firmware
run-name: Release - jdcloud_er1_libwrt

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taiyi-production-release
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build_wrt.yml
    with:
      model: jdcloud_er1_libwrt
      add_fragments: ""
      remove_fragments: ""
      use_audited_builder: true
      audited_builder_image: ${{ vars.TAIYI_BUILDER_IMAGE }}
      audited_builder_manifest_digest: ${{ vars.TAIYI_BUILDER_MANIFEST_DIGEST }}
      audited_builder_config_image_id: ${{ vars.TAIYI_BUILDER_CONFIG_IMAGE_ID }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    environment: taiyi-production
    permissions:
      contents: write

    steps:
      - name: Download Verified Firmware
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: firmware-jdcloud_er1_libwrt
          path: firmware

      - name: Prepare Whitelisted Release Assets
        id: release_metadata
        shell: bash
        env:
          EXPECTED_TAIYI_BUILDER_IMAGE: ${{ vars.TAIYI_BUILDER_IMAGE }}
          EXPECTED_TAIYI_BUILDER_MANIFEST_DIGEST: ${{ vars.TAIYI_BUILDER_MANIFEST_DIGEST }}
          EXPECTED_TAIYI_BUILDER_CONFIG_IMAGE_ID: ${{ vars.TAIYI_BUILDER_CONFIG_IMAGE_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          factory_images=(firmware/*-jdcloud_re-cs-07-squashfs-factory.bin)
          sysupgrade_images=(firmware/*-jdcloud_re-cs-07-squashfs-sysupgrade.bin)
          all_bin_images=(firmware/*.bin)

          if (( ${#factory_images[@]} != 1 )); then
            echo "Expected exactly one factory image, found ${#factory_images[@]}." >&2
            exit 1
          fi
          if (( ${#sysupgrade_images[@]} != 1 )); then
            echo "Expected exactly one sysupgrade image, found ${#sysupgrade_images[@]}." >&2
            exit 1
          fi
          if (( ${#all_bin_images[@]} != 2 )); then
            echo "Expected only the two Taiyi .bin images, found ${#all_bin_images[@]}." >&2
            exit 1
          fi

          release_metadata=(
            firmware/BUILD_PROVENANCE.txt
            firmware/libwrt-qualcommax-ipq60xx.manifest
            firmware/profiles.json
            firmware/config.buildinfo
            firmware/feeds.buildinfo
            firmware/version.buildinfo
          )
          required_metadata=(
            firmware/SHA256SUMS
            "${release_metadata[@]}"
          )
          for metadata_file in "${required_metadata[@]}"; do
            if [[ ! -s $metadata_file ]]; then
              echo "Required release metadata is missing or empty: $metadata_file" >&2
              exit 1
            fi
          done

          jq -e '
            (.profiles | type == "object") and
            (.profiles | length == 1) and
            (.profiles | has("jdcloud_re-cs-07")) and
            (.profiles["jdcloud_re-cs-07"].supported_devices == ["jdcloud,re-cs-07"])
          ' firmware/profiles.json >/dev/null

          expected_container_base='ubuntu:24.04@sha256:a61567bd31828687156d735ea8eb01ba4e37636e225dd6a48ba94136a70d9d61'
          expected_container_ref=$EXPECTED_TAIYI_BUILDER_IMAGE
          expected_manifest_digest=$EXPECTED_TAIYI_BUILDER_MANIFEST_DIGEST
          expected_container_id=$EXPECTED_TAIYI_BUILDER_CONFIG_IMAGE_ID
          [[ $expected_container_ref =~ @sha256:[0-9a-f]{64}$ ]]
          [[ $expected_manifest_digest =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ ${expected_container_ref##*@} == "$expected_manifest_digest" ]]
          [[ $expected_container_id =~ ^sha256:[0-9a-f]{64}$ ]]
          grep -qFx "WrtReleaseTreeState: clean" firmware/BUILD_PROVENANCE.txt
          grep -qFx "BuildContainerBase: $expected_container_base" firmware/BUILD_PROVENANCE.txt
          grep -qFx "BuildContainerImageRef: $expected_container_ref" firmware/BUILD_PROVENANCE.txt
          grep -qFx "BuildContainerManifestDigest: $expected_manifest_digest" firmware/BUILD_PROVENANCE.txt
          grep -qFx "BuildContainerImageId: $expected_container_id" firmware/BUILD_PROVENANCE.txt

          (cd firmware && sha256sum -c SHA256SUMS)

          mkdir -p release-assets
          cp "${factory_images[0]}" "${sysupgrade_images[0]}" release-assets/
          cp "${release_metadata[@]}" release-assets/
          (
            cd release-assets
            mapfile -d '' release_files < <(find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%P\0' | sort -z)
            sha256sum "${release_files[@]}" >SHA256SUMS
            sha256sum -c SHA256SUMS
          )

          release_date=$(TZ=Asia/Shanghai date +'%Y%m%d-%H%M%S')
          short_commit=${GITHUB_SHA:0:12}
          release_tag="taiyi-25.12.2-k6.12.103-r${GITHUB_RUN_NUMBER}-${short_commit}-${release_date}"
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"

          {
            echo "Taiyi / JDCloud RE-CS-07 production firmware"
            echo
            echo "Build provenance:"
            echo '```text'
            cat firmware/BUILD_PROVENANCE.txt
            echo '```'
            echo
            echo "Firmware images:"
            echo '```text'
            sha256sum "${factory_images[0]}" "${sysupgrade_images[0]}"
            echo '```'
            echo
            echo "- Use the sysupgrade image only when upgrading from a running OpenWrt system."
            echo "- The factory image is for the documented installation or recovery path; do not pass it to sysupgrade."
            echo "- Verify SHA256 and run sysupgrade -T before any upgrade. Never bypass board checks with sysupgrade -F."
          } > release_body.md

      - name: Publish Taiyi Release
        uses: softprops/action-gh-release@2bb465e97f322d3cb2a965294d483e0d26a67aa9 # v3.0.1
        with:
          tag_name: ${{ steps.release_metadata.outputs.release_tag }}
          files: release-assets/*
          fail_on_unmatched_files: true
          body_path: release_body.md
