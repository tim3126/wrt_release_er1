name: Build WRT
run-name: Build - ${{ inputs.model }}

on:
  workflow_dispatch:
    inputs:
      model:
        required: true
        description: Device Model
        type: choice
        default: jdcloud_er1_libwrt
        options:
          - aliyun_ap8220_immwrt
          - aliyun_ap8220_libwrt
          - cmcc_rax3000m_immwrt
          - gemtek_w1701k_immwrt
          - jdcloud_ax6000_immwrt
          - jdcloud_er1_libwrt
          - jdcloud_ipq60xx_immwrt
          - jdcloud_ipq60xx_libwrt
          - link_nn6000v2_immwrt
          - linksys_mx4x00_immwrt
          - n1_immwrt
          - qihoo_360v6_immwrt
          - redmi_ax5_immwrt
          - redmi_ax6_immwrt
          - redmi_ax6_libwrt
          - redmi_ax6000_immwrt21
          - zn_m2_immwrt
          - zn_m2_libwrt
          - x64_immwrt
      add_fragments:
        required: false
        description: Add config fragments, comma separated
        default: ""
      remove_fragments:
        required: false
        description: Remove default config fragments, comma separated
        default: ""
      export_plugin_feed_candidate:
        required: false
        description: Stage the reviewed Taiyi add-on APK candidate without any signing key
        type: boolean
        default: false
      use_audited_builder:
        required: false
        description: Run the Taiyi build inside a pulled, digest-pinned audited builder
        type: boolean
        default: false
      audited_builder_image:
        required: false
        description: Immutable OCI image reference ending in @sha256:...
        type: string
        default: ""
      audited_builder_manifest_digest:
        required: false
        description: OCI manifest digest matching audited_builder_image
        type: string
        default: ""
      audited_builder_config_image_id:
        required: false
        description: Audited local Docker config image ID for the pulled image
        type: string
        default: ""
  workflow_call:
    inputs:
      model:
        required: true
        type: string
      add_fragments:
        required: false
        type: string
        default: ""
      remove_fragments:
        required: false
        type: string
        default: ""
      export_plugin_feed_candidate:
        required: false
        type: boolean
        default: false
      use_audited_builder:
        required: false
        type: boolean
        default: false
      audited_builder_image:
        required: false
        type: string
        default: ""
      audited_builder_manifest_digest:
        required: false
        type: string
        default: ""
      audited_builder_config_image_id:
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: wrt-build-${{ inputs.model }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOWNLOAD_JOBS: "8"
  BUILD_JOBS: "4"

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      TAIYI_EXPORT_PLUGIN_FEED_CANDIDATE: ${{ inputs.export_plugin_feed_candidate }}
      TAIYI_USE_AUDITED_BUILDER: ${{ inputs.use_audited_builder }}
      TAIYI_AUDITED_BUILDER_IMAGE: ${{ inputs.audited_builder_image }}
      TAIYI_AUDITED_BUILDER_MANIFEST_DIGEST: ${{ inputs.audited_builder_manifest_digest }}
      TAIYI_AUDITED_BUILDER_CONFIG_IMAGE_ID: ${{ inputs.audited_builder_config_image_id }}

    steps:
      - name: Free Disk Space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -hT

      - name: Checkout wrt_release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate Audited Taiyi Builder
        if: ${{ inputs.model == 'jdcloud_er1_libwrt' && inputs.use_audited_builder }}
        shell: bash
        run: |
          set -euo pipefail

          image=$TAIYI_AUDITED_BUILDER_IMAGE
          manifest_digest=$TAIYI_AUDITED_BUILDER_MANIFEST_DIGEST
          expected_config_id=$TAIYI_AUDITED_BUILDER_CONFIG_IMAGE_ID
          [[ $image =~ @sha256:[0-9a-f]{64}$ ]]
          [[ $manifest_digest =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ ${image##*@} == "$manifest_digest" ]]
          [[ $expected_config_id =~ ^sha256:[0-9a-f]{64}$ ]]

          docker pull "$image"
          actual_config_id=$(docker image inspect --format '{{.Id}}' "$image")
          [[ $actual_config_id == "$expected_config_id" ]]

          {
            printf 'BUILD_CONTAINER_IMAGE_REF=%s\n' "$image"
            printf 'BUILD_CONTAINER_MANIFEST_DIGEST=%s\n' "$manifest_digest"
            printf 'BUILD_CONTAINER_IMAGE_ID=%s\n' "$actual_config_id"
          } >> "$GITHUB_ENV"

      - name: Install Build Dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ g++-multilib gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev libelf-dev zlib1g-dev \
            python3 python3-pyelftools python3-setuptools rsync unzip bzip2 \
            xz-utils file wget curl patch diffutils subversion swig time \
            xsltproc zstd device-tree-compiler ccache cmake ninja-build \
            pkgconf jq dos2unix libfuse-dev
          sudo apt-get clean

      - name: Set Build Metadata
        id: metadata
        shell: bash
        env:
          RAW_ADD_CONFIG_FRAGMENTS: ${{ inputs.add_fragments }}
          RAW_REMOVE_CONFIG_FRAGMENTS: ${{ inputs.remove_fragments }}
        run: |
          build_date=$(TZ=Asia/Shanghai date +"%y.%m.%d_%H.%M.%S")
          {
            printf 'BUILD_DATE=%s\n' "$build_date"
            printf 'WRT_RELEASE_COMMIT=%s\n' "$GITHUB_SHA"
            printf 'ADD_CONFIG_FRAGMENTS=%s\n' "$RAW_ADD_CONFIG_FRAGMENTS"
            printf 'REMOVE_CONFIG_FRAGMENTS=%s\n' "$RAW_REMOVE_CONFIG_FRAGMENTS"
          } >> "$GITHUB_ENV"
          printf 'build_date=%s\n' "$build_date" >> "$GITHUB_OUTPUT"

      - name: Verify Taiyi Build Invariants
        if: ${{ inputs.model == 'jdcloud_er1_libwrt' }}
        shell: bash
        run: |
          node tests/taiyi-package-manager-provider-rendering.js
          bash tests/taiyi-build-invariants.sh

      - name: Pre Clone
        shell: bash
        run: ./wrt_core/pre_clone_action.sh "${{ inputs.model }}"

      - name: Cache Downloads and Compiler Objects
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ./action_build/dl
            ./action_build/.ccache
          key: ${{ runner.os }}-${{ inputs.model }}-${{ hashFiles('repo_flag', 'build.sh', 'wrt_core/**/*.sh', 'wrt_core/**/*.ini', 'wrt_core/**/*.config', 'wrt_core/patches/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.model }}-

      - name: Machine Information
        shell: bash
        run: |
          printf 'Runner: %s (%s/%s)\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
          uname -a
          nproc
          free -h
          df -hT
          printf 'Parallelism: download=%s compile=%s\n' "$DOWNLOAD_JOBS" "$BUILD_JOBS"

      - name: Build Firmware
        shell: bash
        run: |
          set -euo pipefail

          if [[ $TAIYI_EXPORT_PLUGIN_FEED_CANDIDATE == true ]]; then
            export TAIYI_PLUGIN_FEED_STAGE_DIR="$GITHUB_WORKSPACE/plugin-feed-candidate"
          fi

          if [[ $TAIYI_USE_AUDITED_BUILDER == true ]]; then
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -v "$GITHUB_WORKSPACE:/build" \
              -w /build \
              -e HOME=/tmp \
              -e ADD_CONFIG_FRAGMENTS \
              -e REMOVE_CONFIG_FRAGMENTS \
              -e DOWNLOAD_JOBS \
              -e BUILD_JOBS \
              -e TAIYI_PLUGIN_FEED_STAGE_DIR \
              -e WRT_RELEASE_COMMIT \
              -e WRT_RELEASE_TREE_STATE \
              -e WRT_RELEASE_INPUT_SHA256 \
              -e BUILD_CONTAINER_IMAGE_REF \
              -e BUILD_CONTAINER_MANIFEST_DIGEST \
              -e BUILD_CONTAINER_IMAGE_ID \
              "$TAIYI_AUDITED_BUILDER_IMAGE" \
              bash -c './build.sh "$1"' -- "${{ inputs.model }}"
          else
            ./build.sh "${{ inputs.model }}"
          fi

      - name: Summarize Taiyi Images
        if: ${{ inputs.model == 'jdcloud_er1_libwrt' }}
        shell: bash
        run: |
          {
            echo "## Taiyi firmware images"
            echo
            echo '```text'
            find ./firmware -maxdepth 1 -type f \
              \( -name '*-jdcloud_re-cs-07-squashfs-factory.bin' \
                 -o -name '*-jdcloud_re-cs-07-squashfs-sysupgrade.bin' \) \
              -print0 | sort -z | xargs -0r sha256sum
            echo '```'
            echo
            echo "Use sysupgrade.bin only for upgrades from a running OpenWrt system."
            echo "factory.bin is for the documented installation or recovery path, not sysupgrade."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Taiyi Plugin Feed Candidate
        if: ${{ inputs.model == 'jdcloud_er1_libwrt' && inputs.export_plugin_feed_candidate }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: taiyi-plugin-feed-candidate-${{ inputs.model }}
          path: ./plugin-feed-candidate/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload Firmware Candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-${{ inputs.model }}
          path: ./firmware/*
          if-no-files-found: error
          retention-days: 14
